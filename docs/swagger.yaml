info:
  contact: {}
  description: DDD asosida qurilgan e-commerce marketplace backend
  title: Uzum Clone API
  version: "1.0"
paths:
  /admin/dashboard/low-stock:
    get:
      description: Eng kam zaxiraga ega (o'chirilmagan) top-5 mahsulot. Faqat admin
        uchun.
      produces:
      - application/json
      responses:
        "200":
          description: Kam zaxirali mahsulotlar
          schema:
            allOf:
            - $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_admin_dashboard.LowStockProduct'
                  type: array
              type: object
        "401":
          description: Autentifikatsiya talab qilinadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "403":
          description: Faqat admin uchun
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: Kam zaxirali mahsulotlar
      tags:
      - admin-dashboard
  /admin/dashboard/revenue-history:
    get:
      description: Daromadni davr (kun yoki oy) bo'yicha guruhlab qaytaradi, faqat
        to'langan va bekor qilinmagan buyurtmalar bo'yicha - frontend'dagi oddiy grafik
        uchun. Faqat admin uchun.
      parameters:
      - description: 'Guruhlash davri: day yoki month'
        in: query
        name: period
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daromad tarixi
          schema:
            allOf:
            - $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_admin_dashboard.RevenuePoint'
                  type: array
              type: object
        "400":
          description: period 'day' yoki 'month' bo'lishi kerak
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "401":
          description: Autentifikatsiya talab qilinadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "403":
          description: Faqat admin uchun
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daromad tarixi
      tags:
      - admin-dashboard
  /admin/dashboard/summary:
    get:
      description: Jami mahsulotlar soni (o'chirilganlardan tashqari), jami sotilgan
        birliklar va jami daromad (faqat to'langan va bekor qilinmagan buyurtmalar
        bo'yicha). Faqat admin uchun.
      produces:
      - application/json
      responses:
        "200":
          description: Umumiy statistika
          schema:
            allOf:
            - $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_admin_dashboard.SummaryResponse'
              type: object
        "401":
          description: Autentifikatsiya talab qilinadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "403":
          description: Faqat admin uchun
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: Umumiy statistika
      tags:
      - admin-dashboard
  /admin/gallery:
    post:
      consumes:
      - multipart/form-data
      description: Rasm(lar) (eng ko'pi bilan 3 ta) va ixtiyoriy tavsif bilan yangi
        galereya posti yaratadi. Faqat admin uchun.
      parameters:
      - description: Rasmlar (eng ko'pi bilan 3 ta)
        in: formData
        name: images
        type: file
      - description: Tavsif
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Post yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_gallery_interfaces_http.GalleryPostResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov, 3 tadan ortiq rasm yoki yaroqsiz fayl
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "401":
          description: Autentifikatsiya talab qilinadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "403":
          description: Faqat admin uchun
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: Yangi galereya posti yaratish
      tags:
      - gallery
  /admin/gallery/{id}:
    delete:
      description: Postni bazadan o'chiradi va uning rasmlarini S3'dan ham tozalaydi.
        Faqat admin uchun.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Post o'chirildi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "401":
          description: Autentifikatsiya talab qilinadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "403":
          description: Faqat admin uchun
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "404":
          description: Post topilmadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: Galereya postini o'chirish
      tags:
      - gallery
  /admin/orders:
    post:
      consumes:
      - application/json
      description: Admin tomonidan cart'siz, to'g'ridan-to'g'ri buyurtma yaratadi
        (masalan, telefon orqali qabul qilingan yoki do'kondagi offline savdo). Catalog'dan
        joriy nom/narxni "surat" qiladi va zaxirani atomik ravishda kamaytiradi (Checkout
        bilan bir xil mantiq). Faqat admin uchun.
      parameters:
      - description: Mijoz ma'lumotlari, mahsulotlar ro'yxati va boshlang'ich to'lov
          holati
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_ordering_interfaces_http.CreateManualOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Buyurtma yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_ordering_interfaces_http.OrderResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov, bo'sh ro'yxat yoki noto'g'ri holat/manzil/telefon
            qiymati
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "401":
          description: Autentifikatsiya talab qilinadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "403":
          description: Faqat admin uchun
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "404":
          description: Mahsulot topilmadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "409":
          description: Mahsulot uchun yetarli zaxira yo'q
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: Qo'lda buyurtma yaratish (offline savdo)
      tags:
      - orders
  /admin/orders/{id}/cancel:
    patch:
      description: Buyurtmani bekor qiladi va Checkout/CreateManualOrder paytida kamaytirilgan
        zaxirani Catalog'ga qaytaradi. Faqat Preparing holatidagi buyurtmalar bekor
        qilinishi mumkin - courier'ga topshirilgan yoki yetkazilgan buyurtmani bu
        yo'l bilan bekor qilib bo'lmaydi. Faqat admin uchun.
      parameters:
      - description: Buyurtma ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bekor qilingan buyurtma
          schema:
            allOf:
            - $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_ordering_interfaces_http.OrderResponse'
              type: object
        "401":
          description: Autentifikatsiya talab qilinadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "403":
          description: Faqat admin uchun
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "404":
          description: Buyurtma topilmadi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "409":
          description: Courier'ga topshirilgan yoki yetkazilgan buyurtmani bekor qilib
            bo'lmaydi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/github_com_JavascriptDev347_uzum-clone-with-ddd_git_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: Buyurtmani bekor qilish
      tags:
      - orders
  /admin/reviews/{id}:
    delete:
      description: Istalgan foydalanuvchi yozgan sharhni butunlay o'chiradi (moderatsiya).
        Faqat admin uchun.
      parameters:
      - description: Sharh ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sharh o'chirildi
