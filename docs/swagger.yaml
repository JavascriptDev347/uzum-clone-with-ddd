  application.EventOutput:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      cta:
        type: string
      eyebrow:
        type: string
      id:
        type: string
      image:
        type: string
      is_root:
        type: boolean
      subtitle:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  application.EventOutputForAdmin:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      cta_eng:
        type: string
      cta_ru:
        type: string
      cta_uz:
        type: string
      deleted_at:
        type: string
      eyebrow_eng:
        type: string
      eyebrow_ru:
        type: string
      eyebrow_uz:
        type: string
      id:
        type: string
      image:
        type: string
      is_root:
        type: boolean
      subtitle_eng:
        type: string
      subtitle_ru:
        type: string
      subtitle_uz:
        type: string
      title_eng:
        type: string
      title_ru:
        type: string
      title_uz:
        type: string
      updated_at:
        type: string
    type: object
  application.GetMeOutput:
    properties:
      email:
        type: string
      role:
        type: string
      user_id:
        type: string
