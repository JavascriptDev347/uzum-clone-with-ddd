basePath: /api/v1
definitions:
  application.GetMeOutput:
    properties:
      email:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  application.UpdateCategoryInput:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  http.CreateCategoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      updated_at:
        type: string
    type: object
  http.CreateProductResponse:
    properties:
      amount:
        type: integer
      category_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  http.RegisterResponse:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  http.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: DDD asosida qurilgan e-commerce marketplace backend
  title: Uzum Clone API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Email va parolni tekshirib, access va refresh tokenlarni qaytaradi
      parameters:
      - description: Kirish ma'lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokenlar muvaffaqiyatli berildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Email yoki parol noto'g'ri
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Tizimga kirish
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Token orqali autentifikatsiya qilingan foydalanuvchi ma'lumotlarini
        qaytaradi
      produces:
      - application/json
      responses:
        "200":
          description: Foydalanuvchi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.GetMeOutput'
              type: object
        "401":
          description: Token yaroqsiz yoki mavjud emas
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Joriy foydalanuvchini olish
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Amaldagi refresh token orqali yangi access va refresh token juftligini
        oladi
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Yangi tokenlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Refresh token yaroqsiz yoki muddati o'tgan
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Tokenni yangilash
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Email va parol orqali yangi akkaunt yaratadi
      parameters:
      - description: Ro'yxatdan o'tish ma'lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Foydalanuvchi yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.RegisterResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov yoki email formati
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Email allaqachon band
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Yangi foydalanuvchi ro'yxatdan o'tkazish
      tags:
      - auth
  /categories:
    get:
      consumes:
      - application/json
      description: Kategoriyalarni nomi bo'yicha qidirish
      parameters:
      - description: Kategoriya nomi
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriyalar olish muvaffaqiyatli
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/http.CreateCategoryResponse'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriyalarni olish
      tags:
      - categories
    post:
      consumes:
      - multipart/form-data
      description: Nomi va rasm orqali yangi kategoriya yaratadi
      parameters:
      - description: Kategoriya nomi
        in: formData
        name: name
        required: true
        type: string
      - description: Kategoriya rasmi
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Kategoriya yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.CreateCategoryResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi yoki validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Yangi kategoriya yaratish
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha o'chirish
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya o'chirish muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyani o'chirish
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha olish
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya olish muvaffaqiyatli
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.CreateCategoryResponse'
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriyani olish
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha yangilash
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      - description: Yangilash uchun kategoriya ma'lumotlari
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/application.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya yangilash muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyani yangilash
      tags:
      - categories
  /categories/admin:
    get:
      consumes:
      - application/json
      description: Kategoriyalarni olish
      parameters:
      - description: Kategoriyalarni qidirish
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriyalar olish muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyalarni olish
      tags:
      - categories
  /products:
    post:
      consumes:
      - multipart/form-data
      description: Nomi, narxi, valyutasi, kategoriyasi va rasmi orqali yangi mahsulot
        yaratadi. Faqat admin huquqiga ega foydalanuvchi uchun.
      parameters:
      - description: Mahsulot nomi
        in: formData
        name: name
        required: true
        type: string
      - description: Narx (tiyin/kopeykada)
        in: formData
        name: amount
        required: true
        type: integer
      - description: 'Valyuta (masalan: UZS)'
        in: formData
        name: currency
        required: true
        type: string
      - description: Kategoriya ID
        in: formData
        name: categoryId
        required: true
        type: string
      - description: Mahsulot rasmi
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Mahsulot yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.CreateProductResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi yoki validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Autentifikatsiyadan o'tilmagan
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Huquq yetarli emas
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Yangi mahsulot yaratish
      tags:
      - products
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
