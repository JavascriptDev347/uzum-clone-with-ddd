  application.UpdateEventInput:
    properties:
      category_id:
        type: string
      cta_eng:
        type: string
      cta_ru:
        type: string
      cta_uz:
        type: string
      eyebrow_eng:
        type: string
      eyebrow_ru:
        type: string
      eyebrow_uz:
        type: string
      is_root:
        type: boolean
      subtitle_eng:
        type: string
      subtitle_ru:
        type: string
      subtitle_uz:
        type: string
      title_eng:
        type: string
      title_ru:
        type: string
      title_uz:
        type: string
    type: object
  application.UpdateProductInput:
    properties:
      amount:
        type: integer
      category_id:
        type: string
      clear_discount:
        type: boolean
      clear_tag_eng:
        type: boolean
      clear_tag_ru:
        type: boolean
      clear_tag_uz:
        type: boolean
      currency:
        type: string
      description_eng:
        type: string
      description_ru:
        type: string
      description_uz:
        type: string
      discount_amount:
        type: integer
      is_available:
        type: boolean
      name_eng:
        type: string
      name_ru:
        type: string
      name_uz:
        type: string
      rating:
        type: number
      slug:
        type: string
      sold_count:
        type: integer
      stock:
        type: integer
      tag_eng:
        type: string
      tag_ru:
        type: string
      tag_uz:
