    type: object
  http.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
    type: object
  response.PaginatedResult:
    properties:
      items: {}
      pagination:
        $ref: '#/definitions/response.Pagination'
    type: object
  response.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact: {}
  description: DDD asosida qurilgan e-commerce marketplace backend
  title: Uzum Clone API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Email va parolni tekshirib, access va refresh tokenlarni qaytaradi
      parameters:
      - description: Kirish ma'lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokenlar muvaffaqiyatli berildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Email yoki parol noto'g'ri
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Tizimga kirish
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Token orqali autentifikatsiya qilingan foydalanuvchi ma'lumotlarini
        qaytaradi
      produces:
      - application/json
      responses:
        "200":
          description: Foydalanuvchi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.GetMeOutput'
              type: object
        "401":
          description: Token yaroqsiz yoki mavjud emas
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Joriy foydalanuvchini olish
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Amaldagi refresh token orqali yangi access va refresh token juftligini
        oladi
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Yangi tokenlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Refresh token yaroqsiz yoki muddati o'tgan
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Tokenni yangilash
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Email va parol orqali yangi akkaunt yaratadi
      parameters:
      - description: Ro'yxatdan o'tish ma'lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Foydalanuvchi yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.RegisterResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov yoki email formati
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Email allaqachon band
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Yangi foydalanuvchi ro'yxatdan o'tkazish
      tags:
      - auth
  /categories:
    get:
      consumes:
      - application/json
      description: Kategoriyalarni nomi bo'yicha qidirish. lang bo'yicha localized
        javob qaytadi.
      parameters:
      - description: Kategoriya nomi
        in: query
        name: search
        type: string
      - description: 'Til: uz (default), eng yoki ru'
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriyalar olish muvaffaqiyatli
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.CategoryOutput'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriyalarni olish
      tags:
      - categories
    post:
      consumes:
      - multipart/form-data
      description: Nomi (3 tilda) va rasm orqali yangi kategoriya yaratadi
      parameters:
      - description: Kategoriya nomi (o'zbekcha)
        in: formData
        name: name_uz
        required: true
        type: string
      - description: Kategoriya nomi (inglizcha)
        in: formData
        name: name_eng
        required: true
        type: string
      - description: Kategoriya nomi (ruscha)
        in: formData
        name: name_ru
        required: true
        type: string
      - description: Kategoriya rasmi
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Kategoriya yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.CategoryOutput'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi yoki validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Yangi kategoriya yaratish
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha o'chirish
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya o'chirish muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyani o'chirish
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha olish
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Til: uz (default), eng yoki ru'
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya olish muvaffaqiyatli
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.CategoryOutput'
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriyani olish
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha yangilash (nomi 3 tilda)
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      - description: Yangilash uchun kategoriya ma'lumotlari
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/application.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya yangilash muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Kategoriya topilmadi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyani yangilash
      tags:
      - categories
  /categories/{id}/products:
    get:
      description: Berilgan category_id ga tegishli faol (o'chirilmagan) mahsulotlar
        ro'yxati
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      - description: Mahsulot nomi bo'yicha qidirish
        in: query
        name: search
        type: string
      - description: 'Til: uz (default), eng yoki ru'
        in: query
        name: lang
        type: string
      - description: Sahifa raqami (default 1)
        in: query
        name: page
        type: integer
      - description: Sahifadagi elementlar soni (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Mahsulotlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/response.PaginatedResult'
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriya bo'yicha mahsulotlarni olish
      tags:
      - products
  /categories/admin:
    get:
      consumes:
      - application/json
      description: Barcha kategoriyalarni (o'chirilganlarni ham), 3 ta tildagi to'liq
        ma'lumot bilan qaytaradi
      parameters:
      - description: Kategoriyalarni qidirish
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriyalar olish muvaffaqiyatli
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.CategoryOutputForAdmin'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyalarni olish - admin (o'chirilganlar bilan birga)
      tags:
      - categories
  /events:
    get:
      description: Faol (o'chirilmagan) eventlar ro'yxati. is_root=true bo'lganlar
        birinchi chiqadi. lang bo'yicha localized javob qaytadi.
      parameters:
      - description: 'Til: uz (default), eng yoki ru'
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Eventlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.EventOutput'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Eventlarni olish
      tags:
      - events
    post:
      consumes:
      - multipart/form-data
      description: Eyebrow, title, subtitle, cta, category_id va rasm orqali yangi
        event yaratadi
      parameters:
      - description: Kichik ustki matn (o'zbekcha)
        in: formData
        name: eyebrow_uz
        type: string
      - description: Kichik ustki matn (inglizcha)
        in: formData
        name: eyebrow_eng
        type: string
      - description: Kichik ustki matn (ruscha)
        in: formData
        name: eyebrow_ru
        type: string
      - description: Sarlavha (o'zbekcha)
        in: formData
        name: title_uz
        required: true
        type: string
      - description: Sarlavha (inglizcha)
        in: formData
        name: title_eng
        required: true
        type: string
      - description: Sarlavha (ruscha)
        in: formData
        name: title_ru
        required: true
        type: string
      - description: Kichik matn (o'zbekcha)
        in: formData
        name: subtitle_uz
        type: string
      - description: Kichik matn (inglizcha)
        in: formData
        name: subtitle_eng
        type: string
      - description: Kichik matn (ruscha)
        in: formData
        name: subtitle_ru
        type: string
      - description: Tugma matni (o'zbekcha)
        in: formData
        name: cta_uz
        type: string
      - description: Tugma matni (inglizcha)
        in: formData
        name: cta_eng
        type: string
      - description: Tugma matni (ruscha)
        in: formData
        name: cta_ru
        type: string
      - description: Kategoriya ID
        in: formData
        name: category_id
        required: true
        type: string
      - description: true bo'lsa, ro'yxatda birinchi chiqadi
        in: formData
        name: is_root
        type: boolean
      - description: Event rasmi
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Event yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.EventOutput'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi yoki validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Autentifikatsiyadan o'tilmagan
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Huquq yetarli emas
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Yangi event (banner) yaratish
      tags:
      - events
  /events/{id}:
    delete:
      description: Eventni ID bo'yicha o'chirish (soft delete)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event o'chirish muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Event topilmadi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Eventni o'chirish
      tags:
      - events
    get:
      description: Eventni ID bo'yicha olish
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Til: uz (default), eng yoki ru'
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.EventOutput'
              type: object
        "404":
          description: Event topilmadi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Eventni olish
      tags:
      - events
    put:
      consumes:
      - application/json
      description: Eventni ID bo'yicha yangilash (JSON body, rasm bu yerda o'zgartirilmaydi)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Yangilash uchun event ma'lumotlari
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/application.UpdateEventInput'
      produces:
      - application/json
      responses:
        "200":
          description: Event yangilash muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Event topilmadi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Eventni yangilash
      tags:
      - events
  /events/admin:
    get:
      description: Barcha eventlarni (o'chirilganlarni ham) qaytaradi
      produces:
      - application/json
      responses:
        "200":
          description: Eventlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.EventOutputForAdmin'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Eventlarni olish - admin (o'chirilganlar bilan birga)
      tags:
      - events
  /products:
    get:
      description: Faol (o'chirilmagan) mahsulotlar ro'yxati, nomi va/yoki category_id
        bo'yicha filtrlash mumkin. lang bo'yicha localized javob qaytadi.
      parameters:
      - description: Mahsulot nomi bo'yicha qidirish
        in: query
        name: search
        type: string
