      id:
        type: string
      image_public_id:
        type: string
      image_url:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  application.CategoryOutputForAdmin:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      image_public_id:
        type: string
      image_url:
        type: string
      name_eng:
        type: string
      name_ru:
        type: string
      name_uz:
        type: string
      updated_at:
        type: string
