info:
  contact: {}
  description: DDD asosida qurilgan e-commerce marketplace backend
  title: Uzum Clone API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Email va parolni tekshirib, access va refresh tokenlarni qaytaradi
      parameters:
      - description: Kirish ma'lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokenlar muvaffaqiyatli berildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Email yoki parol noto'g'ri
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Tizimga kirish
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Token orqali autentifikatsiya qilingan foydalanuvchi ma'lumotlarini
        qaytaradi
      produces:
      - application/json
      responses:
        "200":
          description: Foydalanuvchi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.GetMeOutput'
              type: object
        "401":
          description: Token yaroqsiz yoki mavjud emas
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Joriy foydalanuvchini olish
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Amaldagi refresh token orqali yangi access va refresh token juftligini
        oladi
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Yangi tokenlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Refresh token yaroqsiz yoki muddati o'tgan
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Tokenni yangilash
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Email va parol orqali yangi akkaunt yaratadi
      parameters:
      - description: Ro'yxatdan o'tish ma'lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Foydalanuvchi yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.RegisterResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov yoki email formati
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Email allaqachon band
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Yangi foydalanuvchi ro'yxatdan o'tkazish
      tags:
      - auth
  /categories:
    get:
      consumes:
      - application/json
      description: Kategoriyalarni nomi bo'yicha qidirish
      parameters:
      - description: Kategoriya nomi
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriyalar olish muvaffaqiyatli
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/http.CreateCategoryResponse'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriyalarni olish
      tags:
      - categories
    post:
      consumes:
      - multipart/form-data
      description: Nomi va rasm orqali yangi kategoriya yaratadi
      parameters:
      - description: Kategoriya nomi
        in: formData
        name: name
        required: true
        type: string
      - description: Kategoriya rasmi
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Kategoriya yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.CreateCategoryResponse'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi yoki validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Yangi kategoriya yaratish
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha o'chirish
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya o'chirish muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyani o'chirish
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha olish
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya olish muvaffaqiyatli
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.CreateCategoryResponse'
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriyani olish
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Kategoriyani ID bo'yicha yangilash
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      - description: Yangilash uchun kategoriya ma'lumotlari
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/application.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriya yangilash muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyani yangilash
      tags:
      - categories
  /categories/{id}/products:
    get:
      description: Berilgan category_id ga tegishli faol (o'chirilmagan) mahsulotlar
        ro'yxati
      parameters:
      - description: Kategoriya ID
        in: path
        name: id
        required: true
        type: string
      - description: Mahsulot nomi bo'yicha qidirish
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mahsulotlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.ProductOutput'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Kategoriya bo'yicha mahsulotlarni olish
      tags:
      - products
  /categories/admin:
    get:
      consumes:
      - application/json
      description: Kategoriyalarni olish
      parameters:
      - description: Kategoriyalarni qidirish
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategoriyalar olish muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Kategoriyalarni olish
      tags:
      - categories
  /events:
    get:
      description: Faol (o'chirilmagan) eventlar ro'yxati. is_root=true bo'lganlar
        birinchi chiqadi
      produces:
      - application/json
      responses:
        "200":
          description: Eventlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.EventOutput'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Eventlarni olish
      tags:
      - events
    post:
      consumes:
      - multipart/form-data
      description: Eyebrow, title, subtitle, cta, category_id va rasm orqali yangi
        event yaratadi
      parameters:
      - description: Kichik ustki matn
        in: formData
        name: eyebrow
        type: string
      - description: Sarlavha
        in: formData
        name: title
        required: true
        type: string
      - description: Kichik matn (subtitle)
        in: formData
        name: subtitle
        type: string
      - description: Tugma matni
        in: formData
        name: cta
        type: string
      - description: Kategoriya ID
        in: formData
        name: category_id
        required: true
        type: string
      - description: true bo'lsa, ro'yxatda birinchi chiqadi
        in: formData
        name: is_root
        type: boolean
      - description: Event rasmi
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Event yaratildi
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.EventOutput'
              type: object
        "400":
          description: Noto'g'ri so'rov tanasi yoki validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Autentifikatsiyadan o'tilmagan
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Huquq yetarli emas
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Yangi event (banner) yaratish
      tags:
      - events
  /events/{id}:
    delete:
      description: Eventni ID bo'yicha o'chirish (soft delete)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event o'chirish muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Event topilmadi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Eventni o'chirish
      tags:
      - events
    get:
      description: Eventni ID bo'yicha olish
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/application.EventOutput'
              type: object
        "404":
          description: Event topilmadi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Eventni olish
      tags:
      - events
    put:
      consumes:
      - application/json
      description: Eventni ID bo'yicha yangilash (JSON body, rasm bu yerda o'zgartirilmaydi)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Yangilash uchun event ma'lumotlari
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/application.UpdateEventInput'
      produces:
      - application/json
      responses:
        "200":
          description: Event yangilash muvaffaqiyatli
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Validatsiya xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Event topilmadi
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Eventni yangilash
      tags:
      - events
  /events/admin:
    get:
      description: Barcha eventlarni (o'chirilganlarni ham) qaytaradi
      produces:
      - application/json
      responses:
        "200":
          description: Eventlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.EventOutputForAdmin'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Eventlarni olish - admin (o'chirilganlar bilan birga)
      tags:
      - events
  /products:
    get:
      description: Faol (o'chirilmagan) mahsulotlar ro'yxati, nomi va/yoki category_id
        bo'yicha filtrlash mumkin
      parameters:
      - description: Mahsulot nomi bo'yicha qidirish
        in: query
        name: search
        type: string
      - description: Kategoriya ID bo'yicha filtrlash
        in: query
        name: category_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mahsulotlar
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/application.ProductOutput'
                  type: array
              type: object
        "500":
          description: Ichki server xatosi
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Mahsulotlarni olish
      tags:
      - products
    post:
      consumes:
      - multipart/form-data
      description: Gullar do'koni mahsulotini barcha xususiyatlari (narx, chegirma,
        rasmlar, qadoqlash va h.k.) bilan yaratadi. Faqat admin uchun.
      parameters:
      - description: Mahsulot nomi
        in: formData
        name: name
        required: true
        type: string
      - description: Tavsif
        in: formData
        name: description
        type: string
      - description: Kategoriya ID
        in: formData
        name: category_id
        required: true
        type: string
      - description: Narx (tiyin/kopeykada)
        in: formData
        name: amount
        required: true
        type: integer
      - description: 'Valyuta (masalan: UZS)'
        in: formData
        name: currency
        required: true
        type: string
      - description: Chegirma narxi (ixtiyoriy)
        in: formData
        name: discount_amount
        type: integer
      - description: Slug (bo'sh bo'lsa nomidan avtomatik yasaladi)
        in: formData
        name: slug
        type: string
      - description: YouTube video URL
        in: formData
        name: video_url_youtube
        type: string
      - description: Instagram video URL
        in: formData
        name: video_url_instagram
        type: string
      - description: Sotuvda bor yoki yo'qligi (default true)
        in: formData
        name: is_available
        type: boolean
      - description: Reyting 1-5 (default 1)
        in: formData
        name: rating
        type: number
      - description: Ombordagi soni
        in: formData
        name: stock
        type: integer
      - description: Gullar turi, vergul bilan
        in: formData
        name: flower_types
        type: string
      - description: Rangi
        in: formData
        name: color
        type: string
